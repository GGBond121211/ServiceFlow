# ServiceFlow 2.0 Policy RAG 来源登记
# 这是来源和使用边界登记，不是把所有来源都当成同等法律依据。

version: policy-source-registry-v1
verified_at: 2026-09-04
layers:
  - id: regulation
    priority: 100
    authority: official
    usage: 作为法律边界和引用依据；内容只做条款级结构化释义，回答时回指原文。
  - id: local_guidance
    priority: 80
    authority: official_guidance
    usage: 作为地方监管合规操作参考；不能替代具体地区适用法的核验。
  - id: project_internal
    priority: 50
    authority: project_defined
    usage: 仅表示本项目演示商家的内部服务承诺，不得伪装成法律规定。
  - id: sop
    priority: 40
    authority: project_defined
    usage: 规定客服和 Agent 的处理步骤，不决定法定权利或最终业务事实。
  - id: faq
    priority: 30
    authority: project_defined
    usage: 覆盖口语问法和解释模板；必须回到法规、内部政策和订单事实。
  - id: category_rule
    priority: 40
    authority: project_defined
    usage: 商品类别的分流规则；缺少类别、地区或商品状态时必须追问或转人工。
  - id: reference
    priority: 0
    authority: technical_reference
    usage: 仅记录技术调用依据，不进入售后政策检索语料。

