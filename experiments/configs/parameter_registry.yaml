# 可调参数登记表
# 目的：防止参数被随手改动却无人记得为什么。任何进入实验的参数必须先在此登记。
# 每项：默认值、取值范围、影响哪些指标、归属 Step、结论指向 DECISIONS.md 第几行。
# evidence_status：untested = 当前值只是候选/占位；measured = 已有原始结果但尚未定论；decided = 已依据结果定论。

registry:
  - name: chunk_strategy
    default: policy_clause_boundary
    range: [policy_clause_boundary, token_256, token_512, token_1024]
    affects: [recall_at_k, citation_validity_rate, context_tokens]
    step: 4
    decision_row: 3
    evidence_status: untested

  - name: chunk_overlap
    default: 0.0
    range: [0.0, 0.1, 0.2]
    affects: [recall_at_k, index_size_mb]
    step: 4
    decision_row: 3
    evidence_status: untested

  - name: retrieval_mode
    default: hybrid
    range: [pure_vector, bm25_only, hybrid]
    affects: [recall_at_k, mrr, p95_ms]
    step: 4
    decision_row: 4
    evidence_status: measured
    note: 真实 qwen3.7-text-embedding 的 33 条政策/28 条查询评测中，hybrid Recall@5=0.9551；仍需 holdout 和更大语料复核

  - name: rerank
    default: off
    range: [off, cross_encoder]
    affects: [citation_validity_rate, p95_ms]
    step: 4
    decision_row: 5
    evidence_status: untested
    note: 当前主链路关闭；启发式重排在真实 Embedding 评测中 Recall@5=0.7885，不能代表 Cross-Encoder

  - name: top_k
    default: 5
    range: [3, 5, 8, 10]
    affects: [recall_at_k, p95_ms, context_tokens]
    step: 4
    decision_row: 6
    evidence_status: untested

  - name: rerank_top_n
    default: 5
    range: [5, 10]
    affects: [context_precision, context_tokens]
    step: 4
    decision_row: 6
    evidence_status: untested

  - name: rerank_candidate_k
    default: 10
    range: [5, 10, 20]
    affects: [recall_at_k, context_precision, p95_ms, cost]
    step: 4
    decision_row: 6
    evidence_status: untested
    note: 代码已实现粗召回与最终重排数量分离；10 只是当前候选起点，尚未完成单变量对照

  - name: rerank_timeout_s
    default: 30
    range: [10, 30, 60]
    affects: [p95_ms, fallback_rate, cost]
    step: 4
    decision_row: 5
    evidence_status: untested
    note: 30 秒是外部模型调用的初始超时约束；真实 smoke 成功不代表它优于其他值

  - name: hnsw_m
    default: 16
    range: [8, 16, 32]
    affects: [recall_at_k, index_size_mb, build_time_s]
    step: 4
    decision_row: 7
    evidence_status: untested

  - name: hnsw_ef_construction
    default: 128
    range: [64, 128, 200]
    affects: [recall_at_k, build_time_s]
    step: 4
    decision_row: 7
    evidence_status: untested

  - name: hnsw_ef_search
    default: 64
    range: [32, 64, 128]
    affects: [recall_at_k, p95_ms]
    step: 4
    decision_row: 7
    evidence_status: untested

  - name: history_turns
    default: 4
    range: [2, 4, 8]
    affects: [context_tokens, multi_turn_accuracy, cost]
    step: 3
    decision_row: 9
    evidence_status: untested

  - name: policy_evidence_count
    default: 5
    range: [3, 5, 8]
    affects: [faithfulness, context_tokens]
    step: 3
    decision_row: 9
    evidence_status: untested

  - name: context_input_budget_tokens
    default: 2048
    range: [512, 1024, 2048, 4096, 8192]
    affects: [context_tokens, multi_turn_accuracy, cost, p95_ms]
    step: 3
    decision_row: 9
    evidence_status: untested
    note: 当前代码初始占位值，未由真实 DeepSeek 参数实验确定

  - name: context_output_budget_tokens
    default: 512
    range: [256, 512, 1024]
    affects: [output_tokens, task_completion_rate, cost, p95_ms]
    step: 3
    decision_row: 9
    evidence_status: untested
    note: 当前代码初始占位值，且尚未接入模型请求的 max_tokens 限制

  - name: context_token_estimator
    default: chars_div_4
    range: [chars_div_4, deepseek_tokenizer]
    affects: [context_tokens, budget_overflow_rate]
    step: 3
    decision_row: 9
    evidence_status: untested
    note: chars_div_4 只是粗略估算，真实 API usage 才是实际 Token 依据

  - name: max_tool_loop
    default: 5
    range: [3, 5, 8]
    affects: [task_completion_rate, cost, p95_ms, stuck_rate]
    step: 5
    decision_row: 10
    evidence_status: untested

  - name: max_tool_calls
    default: 12
    range: [6, 12, 20]
    affects: [task_completion_rate, cost, p95_ms, stuck_rate]
    step: 5
    decision_row: 10
    evidence_status: untested
    note: 当前 Native Tool Loop 起点，未完成单变量实验

  - name: structured_output_repair
    default: 1
    range: [0, 1, 2]
    affects: [format_valid_rate, cost]
    step: 5
    decision_row: 10
    evidence_status: untested

  - name: redis_ttl_s
    default: 300
    range: [60, 300, 900]
    affects: [cache_hit_rate, staleness_risk]
    step: 3
    decision_row: 12
    evidence_status: untested
    note: 300 秒已在真实 Redis smoke 中成功写入，但尚未比较 60/300/900 秒

  - name: confirmation_ttl_minutes
    default: 15
    range: [5, 15, 30]
    affects: [confirmation_expiry_rate, unauthorized_execution_rate, task_completion_rate]
    step: 6
    decision_row: S6-3
    evidence_status: untested
    note: 15 分钟是防止旧确认长期有效的安全起点，尚未比较合法用户过期率

  - name: provider_attempts_per_adapter
    default: 2
    range: [1, 2, 3]
    affects: [provider_success_rate, duplicate_side_effect_risk, p95_ms]
    step: 7
    decision_row: S7-2
    evidence_status: untested
    note: 确定性故障注入已证明有界重试语义；2 次不是最优参数结论

  - name: provider_operation_timeout_s
    default: 5
    range: [2, 5, 10]
    affects: [unknown_rate, p95_ms, task_completion_rate]
    step: 7
    decision_row: S7-2
    evidence_status: untested
    note: timeout 后结果不确定必须进入 UNKNOWN 并 query，不允许再次 execute

  - name: provider_reconcile_max_attempts
    default: 3
    range: [1, 3, 5]
    affects: [recovery_rate, manual_queue_rate, recovery_latency]
    step: 7
    decision_row: S7-5
    evidence_status: untested

  - name: provider_reconcile_deadline_minutes
    default: 5
    range: [1, 5, 15]
    affects: [recovery_rate, manual_queue_rate, stale_task_rate]
    step: 7
    decision_row: S7-5
    evidence_status: untested

  - name: task_visibility_timeout_s
    default: 10
    range: [10, 30, 60]
    affects: [duplicate_delivery_risk, restart_recovery_latency]
    step: 7
    decision_row: S7-5
    evidence_status: untested
    note: 测试使用 10 秒验证 lease 恢复语义，不代表生产 workload 的合理值

  - name: trace_sampling_mode
    default: layered
    range: [head, tail, layered]
    affects: [trace_storage_cost, badcase_capture_rate]
    step: 8
    decision_row: 13
    evidence_status: untested
    note: 审计记录不受采样影响，独立全量存 MySQL

  - name: gateway_attempts_per_model
    default: 2
    range: [1, 2, 3]
    affects: [fallback_rate, p95_ms, model_success_rate]
    step: 8
    decision_row: 11
    evidence_status: measured
    note: Fake Provider 故障矩阵验证有界语义；2 次仍是候选起点，不是最优结论

  - name: gateway_total_deadline_s
    default: 20
    range: [10, 20, 30]
    affects: [deadline_rate, p95_ms, manual_queue_rate]
    step: 8
    decision_row: 11
    evidence_status: measured
    note: 确定性测试用 0.08 秒证明跨主备总 deadline；20 秒未做真实参数对照

  - name: gateway_bucket_capacity
    default: 60
    range: [30, 60, 120]
    affects: [quota_rate, queue_rate, provider_rate_limit_rate]
    step: 8
    decision_row: 11
    evidence_status: measured
    note: Redis Lua 契约已测，容量 60 未做负载参数实验

  - name: gateway_refill_per_second
    default: 1
    range: [0.5, 1, 2]
    affects: [quota_rate, throughput, provider_rate_limit_rate]
    step: 8
    decision_row: 11
    evidence_status: untested

  - name: gateway_max_concurrency
    default: 8
    range: [4, 8, 16]
    affects: [backpressure_rate, throughput, p95_ms]
    step: 8
    decision_row: 11
    evidence_status: measured
    note: Redis 并发 lease 契约已测；8 是本地候选起点

  - name: gateway_circuit_failure_threshold
    default: 3
    range: [2, 3, 5]
    affects: [fallback_rate, recovery_latency, provider_error_amplification]
    step: 8
    decision_row: 11
    evidence_status: measured
    note: threshold=1 的确定性测试证明开路后跳过主模型；默认 3 未调优

  - name: gateway_circuit_recovery_s
    default: 30
    range: [10, 30, 60]
    affects: [recovery_latency, repeated_failure_rate]
    step: 8
    decision_row: 11
    evidence_status: untested

discipline:
  - 未登记的参数不得进入实验
  - 每次实验只改一个参数（ExperimentSpec.changedVariable）
  - 结论回写 DECISIONS.md 对应行，并在 results/ 留下原始数据
