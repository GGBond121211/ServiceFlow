[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "serviceflow"
version = "0.1.0"
description = "Evaluated service workflow agent over simulated after-sales data"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "aiomysql>=0.2,<1",
    "aiosqlite>=0.21,<1",
    "cryptography>=43,<47",
    "langgraph>=0.6,<2",
    "openai>=2,<3",
    "pydantic>=2.11,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.35,<1",
]

[project.scripts]
serviceflow = "serviceflow.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/serviceflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
