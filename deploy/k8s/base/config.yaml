apiVersion: v1
kind: ConfigMap
metadata:
  name: serviceflow-config
  namespace: serviceflow
data:
  SERVICEFLOW_DATABASE_URL: mysql+aiomysql://serviceflow:serviceflow@mysql:3306/serviceflow
  SERVICEFLOW_REDIS_URL: redis://redis:6379/0
  SERVICEFLOW_CELERY_BROKER_URL: redis://redis:6379/1
  SERVICEFLOW_CELERY_RESULT_BACKEND: redis://redis:6379/2
  SERVICEFLOW_QDRANT_URL: http://qdrant:6333
  SERVICEFLOW_GATEWAY_URL: http://gateway:8010/v1
  SERVICEFLOW_MODEL: deepseek-v4-flash
  SERVICEFLOW_MCP_TRANSPORT: in_process
  SERVICEFLOW_TRACE_SAMPLE_RATIO: "1"
  SERVICEFLOW_GATEWAY_QUEUE_LIMIT: "0"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
---
apiVersion: v1
kind: Secret
metadata:
  name: serviceflow-secrets
  namespace: serviceflow
type: Opaque
stringData:
  SERVICEFLOW_API_KEY: replace-me-for-local-demo
  SERVICEFLOW_GATEWAY_INTERNAL_KEY: replace-me-for-local-demo
