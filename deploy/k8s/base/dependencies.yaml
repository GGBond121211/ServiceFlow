apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: serviceflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - name: MYSQL_DATABASE
              value: serviceflow
            - name: MYSQL_USER
              value: serviceflow
            - name: MYSQL_PASSWORD
              value: serviceflow
            - name: MYSQL_ROOT_PASSWORD
              value: serviceflow-root
          ports:
            - containerPort: 3306
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-userviceflow", "-pserviceflow", "--silent"]
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: serviceflow
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: serviceflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: serviceflow
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: serviceflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.15.5
          ports:
            - containerPort: 6333
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6333
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: serviceflow
spec:
  selector:
    app: qdrant
  ports:
    - port: 6333
      targetPort: 6333
