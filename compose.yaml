services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-serviceflow}
      MYSQL_USER: ${MYSQL_USER:-serviceflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-serviceflow}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-serviceflow-root}
    ports:
      - "33069:3306"
    volumes:
      - serviceflow_mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "6333:6333"
    volumes:
      - serviceflow_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      gateway-proxy:
        condition: service_started
    environment:
      SERVICEFLOW_DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-serviceflow}:${MYSQL_PASSWORD:-serviceflow}@mysql:3306/${MYSQL_DATABASE:-serviceflow}
      SERVICEFLOW_API_KEY: ${SERVICEFLOW_API_KEY:-}
      SERVICEFLOW_BASE_URL: ${SERVICEFLOW_BASE_URL:-https://api.deepseek.com}
      SERVICEFLOW_MODEL: ${SERVICEFLOW_MODEL:-deepseek-v4-flash}
      SERVICEFLOW_MCP_TRANSPORT: ${SERVICEFLOW_MCP_TRANSPORT:-stdio}
      SERVICEFLOW_THINKING_MODE: ${SERVICEFLOW_THINKING_MODE:-disabled}
      SERVICEFLOW_REASONING_EFFORT: ${SERVICEFLOW_REASONING_EFFORT-}
      SERVICEFLOW_EMBEDDING_API_KEY: ${SERVICEFLOW_EMBEDDING_API_KEY:-}
      SERVICEFLOW_EMBEDDING_BASE_URL: ${SERVICEFLOW_EMBEDDING_BASE_URL:-}
      SERVICEFLOW_EMBEDDING_MODEL: ${SERVICEFLOW_EMBEDDING_MODEL:-}
      CODEINSIGHT_EMBEDDING_API_KEY: ${CODEINSIGHT_EMBEDDING_API_KEY:-}
      CODEINSIGHT_EMBEDDING_BASE_URL: ${CODEINSIGHT_EMBEDDING_BASE_URL:-}
      CODEINSIGHT_EMBEDDING_MODEL: ${CODEINSIGHT_EMBEDDING_MODEL:-}
      SERVICEFLOW_RERANK_ENABLED: ${SERVICEFLOW_RERANK_ENABLED:-false}
      SERVICEFLOW_RERANK_API_KEY: ${SERVICEFLOW_RERANK_API_KEY:-}
      SERVICEFLOW_RERANK_BASE_URL: ${SERVICEFLOW_RERANK_BASE_URL:-}
      SERVICEFLOW_RERANK_MODEL: ${SERVICEFLOW_RERANK_MODEL:-qwen3.7-text-rerank}
      SERVICEFLOW_RERANK_CANDIDATE_K: ${SERVICEFLOW_RERANK_CANDIDATE_K:-10}
      SERVICEFLOW_RERANK_TIMEOUT_S: ${SERVICEFLOW_RERANK_TIMEOUT_S:-30}
      SERVICEFLOW_POLICY_DOCUMENTS_PATH: ${SERVICEFLOW_POLICY_DOCUMENTS_PATH:-}
      SERVICEFLOW_REDIS_URL: redis://redis:6379/0
      SERVICEFLOW_QDRANT_URL: http://qdrant:6333
      SERVICEFLOW_GATEWAY_URL: http://gateway-proxy:8080/v1
      SERVICEFLOW_GATEWAY_INTERNAL_KEY: ${SERVICEFLOW_GATEWAY_INTERNAL_KEY:-serviceflow-local-only}
      SERVICEFLOW_TRACE_SAMPLE_RATIO: ${SERVICEFLOW_TRACE_SAMPLE_RATIO:-1}
    ports:
      - "8009:8000"
    volumes:
      - ./outputs/evaluation:/outputs/evaluation:ro
      - ./experiments/policy_documents:/app/experiments/policy_documents:ro

  gateway-a:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "serviceflow.infrastructure.gateway_server:app", "--host", "0.0.0.0", "--port", "8010"]
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_healthy
    environment: &gateway-environment
      SERVICEFLOW_DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-serviceflow}:${MYSQL_PASSWORD:-serviceflow}@mysql:3306/${MYSQL_DATABASE:-serviceflow}
      SERVICEFLOW_REDIS_URL: redis://redis:6379/0
      SERVICEFLOW_API_KEY: ${SERVICEFLOW_API_KEY:-}
      SERVICEFLOW_BASE_URL: ${SERVICEFLOW_BASE_URL:-https://api.frontier-intelligence.tech/v1}
      SERVICEFLOW_MODEL: ${SERVICEFLOW_MODEL:-deepseek-v4-flash}
      SERVICEFLOW_GATEWAY_BACKUP_MODEL: ${SERVICEFLOW_GATEWAY_BACKUP_MODEL:-gpt-5.6-luna}
      SERVICEFLOW_GATEWAY_ATTEMPTS_PER_MODEL: ${SERVICEFLOW_GATEWAY_ATTEMPTS_PER_MODEL:-2}
      SERVICEFLOW_GATEWAY_DEADLINE_S: ${SERVICEFLOW_GATEWAY_DEADLINE_S:-20}
      SERVICEFLOW_GATEWAY_BUCKET_CAPACITY: ${SERVICEFLOW_GATEWAY_BUCKET_CAPACITY:-60}
      SERVICEFLOW_GATEWAY_REFILL_PER_SECOND: ${SERVICEFLOW_GATEWAY_REFILL_PER_SECOND:-1}
      SERVICEFLOW_GATEWAY_MAX_CONCURRENCY: ${SERVICEFLOW_GATEWAY_MAX_CONCURRENCY:-8}
      SERVICEFLOW_GATEWAY_QUEUE_LIMIT: 0
      SERVICEFLOW_GATEWAY_INTERNAL_KEY: ${SERVICEFLOW_GATEWAY_INTERNAL_KEY:-serviceflow-local-only}
      SERVICEFLOW_GATEWAY_PRIMARY_INPUT_COST: ${SERVICEFLOW_GATEWAY_PRIMARY_INPUT_COST:-12}
      SERVICEFLOW_GATEWAY_PRIMARY_OUTPUT_COST: ${SERVICEFLOW_GATEWAY_PRIMARY_OUTPUT_COST:-36}
      SERVICEFLOW_GATEWAY_PRIMARY_CACHED_INPUT_COST: ${SERVICEFLOW_GATEWAY_PRIMARY_CACHED_INPUT_COST:-0.3996}
      SERVICEFLOW_GATEWAY_BACKUP_INPUT_COST: ${SERVICEFLOW_GATEWAY_BACKUP_INPUT_COST:-1.5}
      SERVICEFLOW_GATEWAY_BACKUP_OUTPUT_COST: ${SERVICEFLOW_GATEWAY_BACKUP_OUTPUT_COST:-12}
      SERVICEFLOW_GATEWAY_BACKUP_CACHED_INPUT_COST: ${SERVICEFLOW_GATEWAY_BACKUP_CACHED_INPUT_COST:-0.18}
      SERVICEFLOW_TRACE_SAMPLE_RATIO: ${SERVICEFLOW_TRACE_SAMPLE_RATIO:-1}
      SERVICEFLOW_GATEWAY_INSTANCE: gateway-a

  gateway-b:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "serviceflow.infrastructure.gateway_server:app", "--host", "0.0.0.0", "--port", "8010"]
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      <<: *gateway-environment
      SERVICEFLOW_GATEWAY_INSTANCE: gateway-b

  gateway-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - gateway-a
      - gateway-b
    ports:
      - "127.0.0.1:8010:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "serviceflow.agent.worker_tasks:celery_app", "worker", "--loglevel=INFO", "--pool=solo"]
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      SERVICEFLOW_DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-serviceflow}:${MYSQL_PASSWORD:-serviceflow}@mysql:3306/${MYSQL_DATABASE:-serviceflow}
      SERVICEFLOW_CELERY_BROKER_URL: redis://redis:6379/1
      SERVICEFLOW_CELERY_RESULT_BACKEND: redis://redis:6379/2
      SERVICEFLOW_TRACE_SAMPLE_RATIO: ${SERVICEFLOW_TRACE_SAMPLE_RATIO:-1}

volumes:
  serviceflow_mysql_data:
  serviceflow_qdrant_data:
